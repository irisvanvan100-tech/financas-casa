<script>
const sb=supabase.createClient("https://tffpcqjzixnquvvahovl.supabase.co","sb_publishable_Yr3s-Xy-TSs13wNCU4qtSA_xq0QqtnN");
const $=s=>document.querySelector(s),S={fatFilter:"Todas"},q=async p=>(await p).data||[];
const R=v=>"R$ "+Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const toNum=x=>{let s=String(x??"").replace(/[R$\s]/g,"");if(!s)return NaN;if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");return/^-?\d*\.?\d+$/.test(s)?Math.round(Number(s)*100)/100:NaN};

const nm=id=>S.perf.find(p=>p.id==id)?.nome||"-",cn=id=>S.cat.find(c=>c.id==id)?.nome||"-",cardNm=id=>S.cart.find(c=>c.id==id)?.nome||"";

/* Cópia local dos dados: mostra na hora o que foi visto da última vez e atualiza quando o Supabase responder */
const FC="fc2|";
const limparCache=()=>{try{Object.keys(localStorage).filter(k=>k.startsWith(FC)||k.startsWith("fin_base_")).forEach(k=>localStorage.removeItem(k))}catch(_){}};

if(!mesma){try{salvo=localStorage.getItem(k)}catch(_){}if(salvo){try{mostrar(JSON.parse(salvo),true)}catch(_){salvo=null}}}

const js=JSON.stringify(novo);try{localStorage.setItem(k,js)}catch(_){}

const ICONS={lanc:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',mes:'<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/></svg>',casa:'<svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',pes:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.8-3.8 5-5.5 8-5.5s6.2 1.7 8 5.5"/></svg>',out:'<svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>'};
function login(){$("#nav").hidden=true;$("#hdr").hidden=true;$("#app").innerHTML=`<div class="login-wrap"><div class="card"><div class="login-logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></div><div class="eyebrow" style="color:var(--pri-dk)">Gestão Familiar</div><h2>Finanças da Casa</h2><p class="mut" style="margin:0 0 8px">Controle compartilhado de compras, despesas fixas e planejamento pessoal.</p><label>E-mail</label><input id="em" type="email" autocomplete="username" placeholder="seu@email.com"><label>Senha</label><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••"><button id="go">Entrar no painel</button></div></div>`;
$("#go").onclick=async()=>{const{data,error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});error?toast("E-mail ou senha incorretos"):start(data.user)}}
async function start(u){S.user=u;const k="fin_base_"+u.id;let cache=null;try{cache=JSON.parse(localStorage.getItem(k))}catch(_){}
const base=Promise.all(["profiles","cartoes","categorias"].map(n=>q(sb.from(n).select("*").order("id")))).then(r=>{if(r[0].length&&r[2].length){try{localStorage.setItem(k,JSON.stringify(r))}catch(_){}}return r});
if(cache&&cache.length===3){[S.perf,S.cart,S.cat]=cache;base.then(r=>{if(r[0].length&&r[2].length)[S.perf,S.cart,S.cat]=r})}else[S.perf,S.cart,S.cat]=await base;
nav();go("lanc")}
const TABS={lanc:["Lançar",vLanc],mes:["Fatura",vMes],casa:["Casa",vCasa],pes:["Pessoal",vPes]};
function nav(){const h=$("#hdr"),raw=(nm(S.user.id)=="-"?(S.user.email||"").split("@")[0]:nm(S.user.id)).trim(),u=raw?raw[0].toUpperCase()+raw.slice(1):"";h.hidden=false;h.innerHTML=`<div class="hero-usr"><div class="eyebrow">Finanças da Casa</div><div class="usr-title">Olá, ${esc(u)} — vamos ver como estão as finanças?</div></div>`;const n=$("#nav");n.hidden=false;n.innerHTML=Object.entries(TABS).map(([k,[t]])=>`<button data-k="${k}">${ICONS[k]}<span>${t}</span></button>`).join("")+`<button id="out">${ICONS.out}<span>Sair</span></button>`;
n.onclick=e=>{const btn=e.target.closest("button");if(!btn)return;if(btn.dataset.k)go(btn.dataset.k);if(btn.id=="out"){limparCache();sb.auth.signOut().then(login)}}}
function go(k){S.ultChave=null;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.k==k));TABS[k][1]()}
function vLanc(){const h=hoje();$("#app").innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Nova compra no cartão</h2><span class="badge b-sand">Rateio 50/50</span></div><div class="row"><div><label>Data da compra</label><input id="d" type="date" value="${h}"></div><div><label>Fatura destino</label><input id="f" type="month" value="${nextM(h.slice(0,7))}"></div></div><label>Valor (R$)</label><input id="v" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00"><label>Estabelecimento</label><input id="e" placeholder="Ex.: Supermercado, Farmácia..."><label>Descrição</label><input id="ds" placeholder="Opcional"><div class="row"><div><label>Quem comprou</label><select id="q">${opt(S.perf,S.user.id)}</select></div><div><label>Cartão</label><select id="c">${opt(S.cart)}</select></div></div><label>Categoria</label><select id="k">${opt(S.cat.filter(x=>x.tipo=="compra"))}</select><label>Observação</label><input id="o" placeholder="Alguma nota para conferência?"><button id="sv">Salvar compra</button></div>`;

async function load(){const f=S.f;return swr("fat|"+f,()=>q(sb.from("lancamentos").select("*").eq("fatura",f+"-01").order("data_compra",{ascending:false})),d=>{if(f!==S.f||!$("#r"))return;S.fd=d;render()})}
function render(){const d=S.fd;const tot=d.reduce((a,x)=>a+ +x.valor,0);const conf=d.filter(x=>x.conferencia=="Conferido").length;const pend=d.filter(x=>!x.conferencia||x.conferencia=="Pendente").length;const divg=d.filter(x=>x.conferencia=="Divergência").length;

const graf=`<svg viewBox="0 -18 ${W} ${HH+40}" width="100%" role="img" aria-label="Dinheiro guardado nos últimos 6 meses, de ${R(P[0].t)} a ${R(P[5].t)}"><line x1="0" y1="${HH}" x2="${W}" y2="${HH}" stroke="var(--bd)"/><line x1="0" y1="${HH/2}" x2="${W}" y2="${HH/2}" stroke="var(--bd)" stroke-dasharray="2 4"/><path d="M${X(0)},${HH} L${lt} L${X(5)},${HH} Z" fill="rgba(122,139,111,.22)"/><path d="M${lc}" fill="none" stroke="var(--snd-dk)" stroke-width="2" stroke-dasharray="3 4"/><path d="M${lt}" fill="none" stroke="var(--pri-dk)" stroke-width="3" stroke-linejoin="round"/><path d="M${X(5)},${Y(P[5].t)} L${X(6)},${Y(proj)}" fill="none" stroke="var(--snd-dk)" stroke-width="3" stroke-dasharray="5 5"/><circle cx="${X(6)}" cy="${Y(proj)}" r="5" fill="var(--card)" stroke="var(--snd-dk)" stroke-width="2.5"/><circle cx="${X(5)}" cy="${Y(P[5].t)}" r="6" fill="var(--pri-dk)" stroke="var(--card)" stroke-width="3"/>${recorde?`<rect x="${+X(5)-36}" y="${Math.max(-16,+Y(P[5].t)-34)}" width="66" height="22" rx="11" fill="var(--snd)"/><text x="${+X(5)-3}" y="${Math.max(-16,+Y(P[5].t)-34)+15}" text-anchor="middle" font-size="11" font-weight="700" fill="#4A3420">Recorde!</text>`:""}<g font-size="11" fill="var(--mut)" text-anchor="middle">${P.map((p,i)=>`<text x="${X(i)}" y="${HH+20}">${MES[+p.k.slice(5)-1]}</text>`).join("")}<text x="${+X(6)-6}" y="${HH+20}">${MES[+addM(cur,1).slice(5)-1]}</text></g></svg>`;
/* conquistas */
let maxPct=0;Object.entries(T.H).forEach(([k,h])=>{if(h.sal>0)maxPct=Math.max(maxPct,depMes(k)/h.sal*100)});
const valor=c=>c.tipo==="guardado"?tot:c.tipo==="azul"?T.best:c.tipo==="tudo_pago"?T.tudoPago:c.tipo==="pct_sal"?maxPct:0;
const prog=c=>{if(c.tipo==="caixinha"){const x=C.find(y=>y.id==c.caixinha_id);return x&&x.meta>0?Math.min(1,x.saldo/x.meta):0}return c.alvo>0?Math.min(1,valor(c)/c.alvo):0};
const todas=PRONTAS.concat(T.conq.map(c=>({...c,id:"u"+c.id,dbid:c.id,minha:true})));
const ganhas=todas.filter(c=>prog(c)>=1);const kM="fin_medalhas_"+S.user.id,vistas=lsGet(kM);
if(vistas!==null){const v=JSON.parse(vistas||"[]");const novas=ganhas.filter(c=>!v.includes(c.id));if(novas.length)setTimeout(()=>toast("Nova conquista desbloqueada: "+novas.map(c=>c.nome).join(", ")+"!"),400)}
lsSet(kM,JSON.stringify(ganhas.map(c=>c.id)));
const n=nivel(T.pts);
const medalha=c=>{const p=prog(c),ok=p>=1;return `<div class="medal${ok?"":" off"}"><span class="ic">${svgI(ok?TIPOS[c.tipo][1]:"lock",22)}</span><span>${esc(c.nome)}</span>${!ok&&p>0?`<span class="ok" style="font-size:.7rem;font-weight:700">${Math.round(p*100)}%</span>`:""}${c.minha?`<button class="s g x" data-delq="${c.dbid}" aria-label="Apagar conquista ${esc(c.nome)}">×</button>`:""}</div>`};
/* caixinhas */
const circ=163.4,cores=["var(--pri)","var(--snd-dk)","var(--pri-dk)"];
const card=(c,i)=>{const p=c.meta>0?Math.min(1,c.saldo/c.meta):0,pc=Math.round(p*100);let sub;if(c.meta>0&&c.saldo>=c.meta)sub='<span class="ok" style="font-weight:700">Meta alcançada!</span>';else if(c.meta>0&&c.media>0)sub=`<span class="ok" style="font-weight:600">No ritmo atual: ${nomeMes(addM(cur,Math.ceil((c.meta-c.saldo)/c.media)))}</span>`;else if(c.meta>0)sub=`Faltam ${R(c.meta-c.saldo)}`;else sub="Sem meta definida";
return `<div class="card"><div style="display:flex;align-items:center;gap:13px"><svg width="58" height="58" viewBox="0 0 64 64" role="img" aria-label="${pc}% da meta" style="flex-shrink:0"><circle cx="32" cy="32" r="26" fill="none" stroke="var(--bg-deep)" stroke-width="8"/><circle cx="32" cy="32" r="26" fill="none" stroke="${cores[i%3]}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(p*circ).toFixed(1)} ${circ}" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" font-size="14" font-weight="700" fill="var(--fg)">${pc}%</text></svg><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:6px;align-items:center"><b>${esc(c.nome)}</b><span class="badge b-sage" style="white-space:nowrap">${String(c.pct).replace(".",",")}% CDI</span></div><div class="num" style="font-size:.9rem">${R(c.saldo)}${c.meta>0?" de "+R(c.meta):""}</div><div class="mut">${sub}</div></div></div><div class="rend"><span>Rendeu este mês<b>+ ${R(c.mesL)}</b>bruto ${R(c.mesB)}</span><span>Rendeu no total<b>+ ${R(c.r.l)}</b>bruto ${R(c.r.b)}</span></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><span class="mut">Você colocou ${R(c.col)}</span><button class="s g" data-delcx="${c.id}" aria-label="Apagar caixinha ${esc(c.nome)}">Apagar</button></div></div>`};
const cdiTxt=cdiC?`CDI hoje: <b style="color:var(--fg)">${cdi.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}% ao ano</b> · ${cdiC.f==="bc"?"Banco Central"+(cdiC.d?" ("+esc(String(cdiC.d).slice(0,5))+")":""):"digitado por você"}`:"Não consegui buscar o CDI no Banco Central.";
const pre=S.guardPre||"";S.guardPre="";
el.innerHTML=`<div class="card card-sage"><div class="eyebrow">Total guardado</div><div class="big">${R(tot)}</div>${deltaPct!==null||delta?`<div style="margin-top:6px"><span class="badge" style="background:rgba(243,239,230,.18);color:#F3EFE6">${delta>=0?"↑":"↓"} ${R(Math.abs(delta))}${deltaPct!==null?` (${delta>=0?"+":""}${deltaPct}%)`:""}</span> <span class="mut">em relação ao mês passado</span></div>`:""}<div class="kpis"><div class="kpi"><small>Você colocou</small><b>${R(totCol)}</b></div><div class="kpi"><small>O dinheiro rendeu</small><b>+ ${R(totL)}</b><small style="margin:2px 0 0">líquido · bruto ${R(totB)}</small></div></div></div>
${C.length?`<div class="card"><h2>Evolução</h2>${graf}<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--mut)"><span style="color:var(--pri-dk)">━ Total com rendimento</span><span style="color:#8A5F3A">┅ Só o que você colocou</span></div><p class="mut" style="margin:8px 0 0">Nesse ritmo, em <b style="color:var(--fg)">${nomeMes(addM(cur,12))}</b> você terá <b class="ok">${R(fut)}</b>.</p></div>`:""}
<div style="display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 4px"><h2 style="margin:0">Minhas caixinhas</h2><span class="mut">${C.length}</span></div>
<p class="mut" style="margin:0 2px 10px">${cdiTxt} <button class="s g" id="cdiEd" style="margin-left:4px">${cdiC?.f==="bc"?"usar outro":"digitar"}</button></p>
${C.length?`<div class="card"><h2>Guardar ou retirar</h2><div class="row"><div><label>Caixinha</label><select id="gc">${C.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join("")}</select></div><div><label>Valor (R$)</label><input id="gv" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${esc(pre)}"></div></div><label>Data</label><input id="gd" type="date" value="${hoje()}"><div class="row"><button id="gin">Guardar</button><button id="gout" class="g" style="margin-top:15px">Retirar</button></div></div>`:""}
${C.map(card).join("")||'<div class="card"><p class="mut" style="margin:0">Você ainda não tem caixinhas. Crie a primeira aqui embaixo!</p></div>'}
<details class="card"${C.length?"":" open"}><summary>+ Nova caixinha</summary><label>Nome</label><input id="cn" placeholder="Ex.: Reserva de emergência, Viagem..."><div class="row"><div><label>Meta (R$)</label><input id="cm" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00"></div><div><label>Já tenho guardado (R$)</label><input id="cv" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00"></div></div><label>Rende quanto do CDI (%)</label><input id="cp2" type="text" inputmode="decimal" autocomplete="off" value="100"><div id="cprev" class="rend" style="display:none"></div><button id="cnew">Criar caixinha</button></details>
<div style="display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 8px"><h2 style="margin:0">Conquistas</h2><span class="mut">${ganhas.length} de ${todas.length}</span></div>
<div class="strip" style="cursor:default"><span style="flex:1"><span style="display:flex;justify-content:space-between;gap:8px"><b>Nível ${n.L} · ${n.nome}</b><span style="opacity:.85;font-size:.84rem">${n.dentro}/250 pts</span></span><span class="xp"><span style="width:${n.dentro/2.5}%"></span></span><span style="display:block;font-size:.74rem;opacity:.9;margin-top:6px">${T.streak} ${T.streak==1?"mês":"meses"} seguidos no azul · Conta paga +20 · Guardar dinheiro +50 · Mês no azul +100</span></span></div>
<div class="medals">${todas.map(medalha).join("")}</div>
<details class="card" style="margin-top:13px"><summary>+ Criar conquista</summary><label>Tipo</label><select id="qt">${Object.entries(TIPOS).map(([k,[t]])=>`<option value="${k}">${t}</option>`).join("")}</select><div id="qaw"><label id="qal">Valor da meta (R$)</label><input id="qa" type="text" inputmode="decimal" autocomplete="off" placeholder="Ex.: 10000"></div><div id="qcw" hidden><label>Caixinha</label><select id="qc">${C.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join("")}</select></div><label>Nome da conquista</label><input id="qn" placeholder="Ex.: Rainha da Reserva"><button id="qnew">Criar conquista</button></details>`;
/* prévia do rendimento ao criar caixinha */
const prev=()=>{const v=toNum($("#cv").value),p=toNum($("#cp2").value),b=$("#cprev");if(!(v>0)||!(p>0)||!cdi){b.style.display="none";return}const d=diaCDI(cdi,p),mB=v*(Math.pow(1+d,21)-1),aB=v*(Math.pow(1+d,252)-1);b.style.display="grid";b.innerHTML=`<span>Por mês<b>+ ${R(mB*(1-.225))}</b>bruto ${R(mB)}</span><span>Em 1 ano<b>+ ${R(aB*(1-.175))}</b>bruto ${R(aB)}</span>`};
$("#cv").oninput=prev;$("#cp2").oninput=prev;
const qLbl={guardado:"Valor da meta (R$)",azul:"Quantos meses seguidos",tudo_pago:"Quantas vezes",pct_sal:"Porcentagem do salário (%)"};
$("#qt").onchange=e=>{const t=e.target.value;$("#qcw").hidden=t!=="caixinha";$("#qaw").hidden=t==="caixinha";if(qLbl[t])$("#qal").textContent=qLbl[t]};
$("#cdiEd").onclick=()=>{const v=prompt("Taxa do CDI ao ano (%). Ex.: 14,9",cdi?String(cdi).replace(".",","):"");if(v===null)return;const x=toNum(v);if(!(x>0))return toast("Taxa inválida");lsSet("fin_cdi_manual",String(x));lsSet("fin_cdi",JSON.stringify({v:x,f:"manual",t:Date.now()}));vGuard()};
el.onclick=async e=>{const t=e.target;
if(t.id==="gin"||t.id==="gout"){const v=toNum($("#gv").value);if(!(v>0))return toast("Valor inválido. Use, por exemplo, 150,00");const id=+$("#gc").value,c=C.find(x=>x.id==id);if(t.id==="gout"&&v>c.saldo+0.005)return toast("Essa caixinha só tem "+R(c.saldo));t.disabled=true;const{error}=await sb.from("caixinha_movs").insert({caixinha_id:id,data:$("#gd").value||hoje(),valor:t.id==="gin"?v:-v});if(error){t.disabled=false;return toast("Erro: "+error.message)}toast(t.id==="gin"?`${R(v)} guardados em ${c.nome}! +50 pontos`:`${R(v)} retirados de ${c.nome}`);return vGuard()}
if(t.id==="cnew"){const nome=$("#cn").value.trim(),meta=toNum($("#cm").value),ja=toNum($("#cv").value),pct=toNum($("#cp2").value);if(!nome)return toast("Dê um nome para a caixinha");if(!(pct>0))return toast("Informe quanto do CDI ela rende. Ex.: 100");t.disabled=true;const{data,error}=await sb.from("caixinhas").insert({nome,meta:meta>0?meta:0,pct_cdi:pct}).select().single();if(error){t.disabled=false;return toast("Erro: "+error.message)}if(ja>0){const r2=await sb.from("caixinha_movs").insert({caixinha_id:data.id,data:hoje(),valor:ja});if(r2.error)toast("Caixinha criada, mas o valor inicial deu erro: "+r2.error.message)}toast("Caixinha criada!");return vGuard()}
if(t.id==="qnew"){const tipo=$("#qt").value,nome=$("#qn").value.trim(),alvo=toNum($("#qa").value),cx=+$("#qc").value||null;if(!nome)return toast("Dê um nome para a conquista");if(tipo==="caixinha"&&!cx)return toast("Crie uma caixinha primeiro");if(tipo!=="caixinha"&&!(alvo>0))return toast("Informe a meta da conquista");t.disabled=true;const{error}=await sb.from("conquistas").insert({nome,tipo,alvo:tipo==="caixinha"?1:alvo,caixinha_id:tipo==="caixinha"?cx:null});if(error){t.disabled=false;return toast("Erro: "+error.message)}toast("Conquista criada!");return vGuard()}
const dq=t.closest("[data-delq]");if(dq){if(!confirm("Apagar esta conquista?"))return;const{error}=await sb.from("conquistas").delete().eq("id",dq.dataset.delq);if(error)return toast("Erro: "+error.message);return vGuard()}
const dc=t.closest("[data-delcx]");if(dc){if(!confirm("Apagar esta caixinha e todo o histórico dela?"))return;const{error}=await sb.from("caixinhas").delete().eq("id",dc.dataset.delcx);if(error)return toast("Erro: "+error.message);toast("Caixinha apagada");return vGuard()}}})}
sb.auth.getSession().then(({data:{session}})=>session?start(session.user):login());
if("serviceWorker"in navigator){const tinha=!!navigator.serviceWorker.controller,av=()=>{$("#upd").hidden=false};navigator.serviceWorker.register("sw.js");navigator.serviceWorker.addEventListener("controllerchange",()=>{if(tinha)av()});navigator.serviceWorker.addEventListener("message",e=>{if(e.data==="nova-versao")av()})}
</script></body></html>
