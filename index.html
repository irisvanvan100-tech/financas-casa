<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7A8B6F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Finanças da Casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3EFE6;
  --fg:#3B2F2A;
  --card:#FAF7F2;
  --mut:#6E615A;
  --pri:#7A8B6F;
  --pri-d:#637359;
  --on:#F3EFE6;
  --ter:#B57256;
  --snd:#E3C4A8;
  --bd:#DFD1BE;
  --bad:#B85437;
  --ok:#5E7452;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#211B18;
    --fg:#F3EFE6;
    --card:#2E2622;
    --mut:#C7B8A8;
    --pri:#8FA182;
    --pri-d:#7A8B6F;
    --on:#1E1916;
    --ter:#CC8668;
    --snd:#E3C4A8;
    --bd:#493D36;
    --bad:#E08A6B;
    --ok:#8FA182;
  }
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font:15.5px/1.42 'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
header,main{max-width:640px;margin:auto;padding:12px}
header{padding-bottom:0}
.usr{
  background:linear-gradient(135deg,var(--pri) 0%,var(--pri-d) 100%);
  color:#F3EFE6;
  border:1px solid var(--snd);
  border-radius:16px;
  padding:13px 16px;
  font-size:.95rem;
  font-weight:600;
  box-shadow:0 4px 14px rgba(59,47,42,.10);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.usr small{
  display:block;
  font-size:.76rem;
  font-weight:500;
  opacity:.88;
  margin-top:2px;
}
.badge-adm{
  background:var(--snd);
  color:#3B2F2A;
  font-size:.7rem;
  font-weight:700;
  padding:3px 9px;
  border-radius:99px;
  letter-spacing:.03em;
  text-transform:uppercase;
  white-space:nowrap;
}
.card{
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:16px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 2px 10px rgba(59,47,42,.04);
}
h1,h2,.big{font-family:'Fraunces',Georgia,serif}
h2{font-size:1.1rem;margin:0 0 8px;color:var(--fg);font-weight:700}
h2.t{margin-top:18px;font-size:.98rem;color:var(--pri-d)}
label{display:block;font-size:.8rem;font-weight:600;color:var(--mut);margin-top:10px;margin-bottom:3px}
input,select,button{
  font:inherit;
  width:100%;
  padding:11px 12px;
  border:1px solid var(--bd);
  border-radius:11px;
  background:var(--bg);
  color:var(--fg);
}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
button{
  background:var(--pri);
  color:var(--on);
  border:0;
  font-weight:600;
  margin-top:14px;
  cursor:pointer;
  transition:opacity .15s,transform .1s;
}
button:active{transform:scale(.99)}
button.g{
  background:rgba(227,196,168,.26);
  color:var(--fg);
  border:1px solid var(--snd);
  margin-top:8px;
}
button.s{width:auto;padding:4px 10px;margin:0;font-size:.82rem;border-radius:8px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.li{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  padding:10px 0;
  border-top:1px solid var(--bd);
  font-size:.92rem;
}
.li small{color:var(--mut);display:block;margin-top:2px;font-size:.79rem}
.li>span:last-child{text-align:right;white-space:nowrap}
.big{font-size:1.85rem;font-weight:700;letter-spacing:-.02em;color:var(--fg);line-height:1.15}
.neg{color:var(--bad)}.mut{color:var(--mut);font-size:.84rem}
nav{
  position:fixed;
  bottom:0;left:0;right:0;
  display:flex;
  background:var(--card);
  border-top:1px solid var(--bd);
  padding-bottom:env(safe-area-inset-bottom);
  z-index:8;
}
nav button{
  margin:0;
  border-radius:0;
  background:none;
  color:var(--mut);
  padding:14px 2px;
  font-size:.86rem;
  border:0;
  border-top:3px solid transparent;
}
nav button.on{
  color:var(--pri-d);
  background:rgba(227,196,168,.28);
  border-top-color:var(--pri);
  font-weight:700;
}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.box{
  background:var(--bg);
  border:1px solid var(--bd);
  border-radius:12px;
  padding:10px 12px;
}
.box.hi{background:rgba(227,196,168,.28);border-color:var(--snd)}
.box b{display:block;font-size:1.02rem;margin-top:2px}
.pago{opacity:.56}
.pago .tt{text-decoration:line-through}
.tag{
  display:inline-block;
  font-size:.72rem;
  padding:2px 8px;
  border-radius:99px;
  background:rgba(122,139,111,.2);
  color:var(--ok);
  font-weight:700;
}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 6px}
.pill{
  width:auto;
  margin:0;
  padding:5px 11px;
  font-size:.78rem;
  border-radius:99px;
  background:var(--bg);
  color:var(--mut);
  border:1px solid var(--bd);
}
.pill.on{
  background:var(--pri);
  color:var(--on);
  border-color:var(--pri);
}
.chart-box{
  margin-top:12px;
  padding:10px 12px;
  border-radius:12px;
  background:var(--bg);
  border:1px solid var(--bd);
}
.chart-leg{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:.76rem;
  color:var(--mut);
  margin-top:6px;
}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
#msg{
  position:fixed;
  top:calc(10px + env(safe-area-inset-top));
  left:50%;
  transform:translateX(-50%);
  background:#3B2F2A;
  color:#F3EFE6;
  border:1px solid var(--snd);
  padding:10px 16px;
  border-radius:12px;
  display:none;
  z-index:10;
  max-width:90%;
  font-size:.88rem;
  box-shadow:0 6px 20px rgba(0,0,0,.2);
}
</style>
</head>
<body>
<div id="msg" role="status"></div>
<header id="hdr" hidden></header>
<main id="app"></main>
<nav id="nav" hidden></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb = supabase.createClient(
  'https://tffpcqjzixnquvvahovl.supabase.co',
  'sb_publishable_Yr3s-Xy-TSs13wNCU4qtSA_xq0QqtnN'
);

const $ = s => document.querySelector(s);
const S = {};
const q = async p => (await p).data || [];
const R = v => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const opt = (a, v) => a.map(x => `<option value="${x.id}"${x.id == v ? ' selected' : ''}>${esc(x.nome)}</option>`).join('');
const hoje = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const nextM = s => { const [y, m] = s.split('-').map(Number); return m == 12 ? `${y + 1}-01` : `${y}-${String(m + 1).padStart(2, '0')}`; };
const nm = id => S.perf.find(p => p.id == id)?.nome || '-';
const cn = id => S.cat.find(c => c.id == id)?.nome || '-';
const ct = id => S.cart.find(c => c.id == id)?.nome || '-';

function toast(t) {
  const m = $('#msg');
  m.textContent = t;
  m.style.display = 'block';
  clearTimeout(m.t);
  m.t = setTimeout(() => m.style.display = 'none', 2600);
}

function barSvg(items) {
  const tot = items.reduce((a, x) => a + Math.max(0, Number(x.val) || 0), 0);
  if (!(tot > 0)) return '';
  let x = 0;
  const rects = items.map(it => {
    const v = Math.max(0, Number(it.val) || 0);
    const w = (v / tot) * 100;
    const r = `<rect x="${x.toFixed(2)}%" y="0" width="${w.toFixed(2)}%" height="12" fill="${it.color}"/>`;
    x += w;
    return r;
  }).join('');
  const legs = items.map(it => `<span><i class="dot" style="background:${it.color}"></i>${esc(it.label)}: <b>${R(it.val)}</b></span>`).join('');
  return `<div class="chart-box"><svg width="100%" height="12" style="border-radius:99px;overflow:hidden;display:block;background:var(--bd)">${rects}</svg><div class="chart-leg">${legs}</div></div>`;
}

function notificarAcessoJaqueline(u) {
  try {
    const nome = nm(u.id);
    const email = u.email || '';
    const isJaq = /jaqueline/i.test(nome + ' ' + email);
    if (!isJaq) return;

    const key = 'fin_jaq_notify_ts';
    const agora = Date.now();
    const ultimo = Number(localStorage.getItem(key) || 0);
    if (agora - ultimo < 15 * 60 * 1000) return;
    localStorage.setItem(key, String(agora));

    const dt = new Date().toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
    const ua = navigator.userAgent || '';
    const disp = /iPhone|iPad/i.test(ua) ? 'iPhone / iPad' : /Android/i.test(ua) ? 'Celular Android' : 'Computador';

    fetch('https://formsubmit.co/ajax/irisvan.van100@gmail.com', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify({
        _subject: 'Finanças da Casa: Jaqueline acessou o app',
        _template: 'table',
        _captcha: 'false',
        Usuario: nome !== '-' ? nome : 'Jaqueline',
        Email_Login: email,
        Data_Hora: dt,
        Dispositivo: disp
      })
    }).catch(() => {});
  } catch (_) {}
}

function login() {
  $('#nav').hidden = true;
  $('#hdr').hidden = true;
  $('#app').innerHTML = `<div class="card">
    <h2>Finanças da Casa</h2>
    <p class="mut" style="margin-top:0">Controle compartilhado do casal</p>
    <label>E-mail</label><input id="em" type="email" autocomplete="username">
    <label>Senha</label><input id="pw" type="password" autocomplete="current-password">
    <button id="go">Entrar</button>
  </div>`;
  $('#go').onclick = async () => {
    const { data, error } = await sb.auth.signInWithPassword({
      email: $('#em').value.trim(),
      password: $('#pw').value
    });
    error ? toast('E-mail ou senha incorretos') : start(data.user);
  };
}

async function start(u) {
  S.user = u;
  const t = ['profiles', 'cartoes', 'categorias'].map(n => q(sb.from(n).select('*').order('id')));
  [S.perf, S.cart, S.cat] = await Promise.all(t);
  notificarAcessoJaqueline(u);
  nav();
  go('lanc');
}

const TABS = { lanc: ['Lançar', vLanc], mes: ['Fatura', vMes], casa: ['Casa', vCasa], pes: ['Pessoal', vPes] };

function nav() {
  const h = $('#hdr');
  const raw = (nm(S.user.id) == '-' ? (S.user.email || '').split('@')[0] : nm(S.user.id)).trim();
  const u = raw ? raw[0].toUpperCase() + raw.slice(1) : '';
  const isAdm = /irisvan/i.test(u + ' ' + (S.user.email || ''));
  h.hidden = false;
  h.innerHTML = `<div class="usr">
    <div>Olá, ${esc(u)} — vamos ver como estão as finanças?<small>Finanças da Casa</small></div>
    ${isAdm ? '<span class="badge-adm">Admin</span>' : ''}
  </div>`;
  const n = $('#nav');
  n.hidden = false;
  n.innerHTML = Object.entries(TABS).map(([k, [t]]) => `<button data-k="${k}">${t}</button>`).join('') + '<button id="out">Sair</button>';
  n.onclick = e => {
    const k = e.target.dataset.k;
    if (k) go(k);
    if (e.target.id == 'out') sb.auth.signOut().then(login);
  };
}

function go(k) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.k == k));
  TABS[k][1]();
}

function vLanc() {
  const h = hoje();
  $('#app').innerHTML = `<div class="card"><h2>Nova compra</h2>
    <div class="row">
      <div><label>Data</label><input id="d" type="date" value="${h}"></div>
      <div><label>Fatura</label><input id="f" type="month" value="${nextM(h.slice(0, 7))}"></div>
    </div>
    <label>Valor (R$)</label><input id="v" type="number" step="0.01" inputmode="decimal" placeholder="0,00">
    <label>Estabelecimento</label><input id="e" placeholder="Ex: Supermercado, Farmácia...">
    <label>Descrição</label><input id="ds" placeholder="Opcional">
    <div class="row">
      <div><label>Quem comprou</label><select id="q">${opt(S.perf, S.user.id)}</select></div>
      <div><label>Cartão</label><select id="c">${opt(S.cart)}</select></div>
    </div>
    <label>Categoria</label><select id="k">${opt(S.cat.filter(x => x.tipo == 'compra'))}</select>
    <label>Observação</label><input id="o" placeholder="Opcional">
    <button id="sv">Salvar compra</button>
  </div>`;
  $('#d').onchange = e => e.target.value && ($('#f').value = nextM(e.target.value.slice(0, 7)));
  $('#sv').onclick = async () => {
    const v = parseFloat($('#v').value);
    if (!(v > 0)) return toast('Informe o valor da compra');
    const { error } = await sb.from('lancamentos').insert({
      data_compra: $('#d').value,
      horario: new Date().toTimeString().slice(0, 5),
      comprador_id: $('#q').value,
      cartao_id: +$('#c').value,
      estabelecimento: $('#e').value,
      descricao: $('#ds').value,
      categoria_id: +$('#k').value,
      valor: v,
      observacao: $('#o').value,
      fatura: $('#f').value + '-01'
    });
    error ? toast('Erro: ' + error.message) : (toast('Compra salva'), vLanc());
  };
}

async function vMes() {
  S.f = S.f || nextM(hoje().slice(0, 7));
  S.ff = S.ff || 'Todas';
  $('#app').innerHTML = `<div class="card"><label>Fatura</label><input id="f" type="month" value="${S.f}"></div><div id="r"></div>`;
  $('#f').onchange = e => { S.f = e.target.value; load(); };
  load();

  async function load() {
    const d = await q(sb.from('lancamentos').select('*').eq('fatura', S.f + '-01').order('data_compra', { ascending: false }));
    const tot = d.reduce((a, x) => a + +x.valor, 0);
    const st = ['Conferido', 'Pendente', 'Divergência'].map(s => `${s}: ${d.filter(x => (x.conferencia || 'Pendente') == s).length}`).join(' · ');
    const byP = {};
    d.forEach(x => { const k = nm(x.comprador_id); byP[k] = (byP[k] || 0) + +x.valor; });
    const pEntries = Object.entries(byP).sort((a, b) => b[1] - a[1]);
    const chart = barSvg(pEntries.map(([k, v], i) => ({
      label: k,
      val: v,
      color: i === 0 ? '#7A8B6F' : '#E3C4A8'
    })));
    const grp = fn => {
      const o = {};
      d.forEach(x => o[fn(x)] = (o[fn(x)] || 0) + +x.valor);
      return Object.entries(o).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="li"><span>${esc(k)}</span><b>${R(v)}</b></div>`).join('');
    };
    const lista = S.ff === 'Todas' ? d : d.filter(x => (x.conferencia || 'Pendente') === S.ff);
    const pills = ['Todas', 'Pendente', 'Conferido', 'Divergência'].map(s =>
      `<button type="button" class="pill${S.ff === s ? ' on' : ''}" data-fl="${s}">${s}</button>`
    ).join('');

    $('#r').innerHTML = `<div class="card">
      <div class="big">${R(tot)}</div>
      <div class="mut">${d.length} compras · metade para cada um: <b>${R(tot / 2)}</b></div>
      <div class="mut" style="margin-top:4px">${st}</div>
      ${chart}
      <h2 class="t">Por pessoa</h2>${grp(x => nm(x.comprador_id))}
      <h2 class="t">Por categoria</h2>${grp(x => cn(x.categoria_id))}
    </div>
    <div class="card">
      <h2>Compras</h2>
      <div class="pills">${pills}</div>
      ${lista.map(x => `<div class="li">
        <span>${esc(x.estabelecimento || x.descricao || '-')}<small>${x.data_compra.split('-').reverse().slice(0, 2).join('/')} · ${esc(nm(x.comprador_id))} · ${esc(ct(x.cartao_id))} · ${esc(cn(x.categoria_id))}${x.observacao ? ' · ' + esc(x.observacao) : ''}</small></span>
        <span><b>${R(x.valor)}</b><br>
          <select data-id="${x.id}" style="width:auto;padding:3px;font-size:.82rem">${['Pendente', 'Conferido', 'Divergência'].map(s => `<option${s == (x.conferencia || 'Pendente') ? ' selected' : ''}>${s}</option>`).join('')}</select>
          <button class="s g" data-del="${x.id}" aria-label="Apagar">×</button>
        </span>
      </div>`).join('') || '<p class="mut">Nenhuma compra neste filtro.</p>'}
    </div>`;

    $('#r').onchange = async e => {
      if (e.target.dataset.id) {
        await sb.from('lancamentos').update({ conferencia: e.target.value }).eq('id', e.target.dataset.id);
        load();
      }
    };
    $('#r').onclick = async e => {
      const fl = e.target.dataset.fl;
      if (fl) { S.ff = fl; load(); return; }
      const id = e.target.dataset.del;
      if (id && confirm('Apagar esta compra?')) {
        await sb.from('lancamentos').delete().eq('id', id);
        load();
      }
    };
  }
}

async function vCasa() {
  S.cm = S.cm || hoje().slice(0, 7);
  const outro = S.perf.find(p => p.id != S.user.id);
  $('#app').innerHTML = `<div class="card"><h2>Nova despesa da casa</h2>
    <div class="row">
      <div><label>Data</label><input id="d" type="date" value="${hoje()}"></div>
      <div><label>Valor (R$)</label><input id="v" type="number" step="0.01" inputmode="decimal" placeholder="0,00"></div>
    </div>
    <div class="row">
      <div><label>Despesa</label><select id="k">${opt(S.cat.filter(x => x.tipo == 'despesa'))}</select></div>
      <div><label>Tipo</label><select id="t"><option>Fixo</option><option>Variável</option></select></div>
    </div>
    <label>Descrição</label><input id="ds" placeholder="Opcional">
    <div class="row">
      <div><label>Minha parte (%) — vazio = 50/50</label><input id="p" type="number" min="0" max="100" inputmode="decimal"></div>
      <div><label>Situação</label><select id="st"><option>A pagar</option><option>Pago</option></select></div>
    </div>
    <button id="sv">Salvar despesa</button>
  </div>
  <div class="card"><label>Mês</label><input id="m" type="month" value="${S.cm}"></div><div id="r"></div>`;
  $('#m').onchange = e => { S.cm = e.target.value; load(); };
  load();

  $('#sv').onclick = async () => {
    const v = parseFloat($('#v').value), p = $('#p').value;
    if (!(v > 0)) return toast('Informe o valor');
    const divisao = p === '' || !outro ? null : { [S.user.id]: p / 100, [outro.id]: 1 - p / 100 };
    const row = {
      data: $('#d').value,
      categoria_id: +$('#k').value,
      tipo: $('#t').value,
      descricao: $('#ds').value,
      valor: v,
      divisao,
      situacao: $('#st').value
    };
    let { error } = await sb.from('despesas_casa').insert(row);
    if (error && /situacao/i.test(error.message)) {
      delete row.situacao;
      ({ error } = await sb.from('despesas_casa').insert(row));
      if (!error) toast('Salvo! Crie a coluna situacao no Supabase para gravar Pago.');
    }
    error ? toast('Erro: ' + error.message) : (toast('Despesa salva'), vCasa());
  };

  async function load() {
    const [d, lanc] = await Promise.all([
      q(sb.from('despesas_casa').select('*').eq('mes', S.cm + '-01').order('data')),
      q(sb.from('lancamentos').select('valor').eq('fatura', S.cm + '-01'))
    ]);
    const mine = x => +x.valor * (x.divisao ? x.divisao[S.user.id] ?? 0 : .5);
    const theirs = x => +x.valor * (x.divisao && outro ? x.divisao[outro.id] ?? 0 : .5);
    const ab = d.filter(x => (x.situacao || 'A pagar') != 'Pago');
    const totLanc = lanc.reduce((a, x) => a + +x.valor, 0);
    const falta = ab.reduce((a, x) => a + +x.valor, 0);
    const totCasa = falta + totLanc;
    const pEu = ab.reduce((a, x) => a + mine(x), 0) + totLanc / 2;
    const pOutro = ab.reduce((a, x) => a + theirs(x), 0) + totLanc / 2;
    const fixo = ab.filter(x => x.tipo == 'Fixo').reduce((a, x) => a + +x.valor, 0);
    const vari = ab.filter(x => x.tipo != 'Fixo').reduce((a, x) => a + +x.valor, 0) + totLanc;

    const cats = {};
    ab.forEach(x => {
      const k = cn(x.categoria_id);
      cats[k] = cats[k] || { t: 0, e: 0, o: 0 };
      cats[k].t += +x.valor;
      cats[k].e += mine(x);
      cats[k].o += theirs(x);
    });
    if (totLanc > 0) {
      cats['Mercado'] = cats['Mercado'] || { t: 0, e: 0, o: 0 };
      cats['Mercado'].t += totLanc;
      cats['Mercado'].e += totLanc / 2;
      cats['Mercado'].o += totLanc / 2;
    }
    const catHtml = Object.entries(cats).sort((a, b) => b[1].t - a[1].t).map(([k, v]) =>
      `<div class="li"><span>${esc(k)}<small>${esc(nm(S.user.id))}: ${R(v.e)}${outro ? ' · ' + esc(nm(outro.id)) + ': ' + R(v.o) : ''}</small></span><b>${R(v.t)}</b></div>`
    ).join('');

    const chart = barSvg([
      { label: 'Fixos', val: fixo, color: '#7A8B6F' },
      { label: 'Variáveis + Fatura', val: vari, color: '#E3C4A8' }
    ]);

    $('#r').innerHTML = `<div class="card">
      <div class="mut">Total da casa (em aberto + fatura)</div>
      <div class="big">${R(totCasa)}</div>
      ${chart}
      <div class="grid">
        <div class="box hi"><span class="mut">Parte ${esc(nm(S.user.id))}</span><b>${R(pEu)}</b></div>
        ${outro ? `<div class="box hi"><span class="mut">Parte ${esc(nm(outro.id))}</span><b>${R(pOutro)}</b></div>` : ''}
        <div class="box"><span class="mut">Gastos fixos</span><b>${R(fixo)}</b></div>
        <div class="box"><span class="mut">Gastos variáveis</span><b>${R(vari)}</b></div>
        <div class="box"><span class="mut">Falta pagar (contas)</span><b>${R(falta)}</b></div>
        <div class="box"><span class="mut">Fatura cartão (50/50)</span><b>${R(totLanc)}</b></div>
      </div>
      ${catHtml ? `<h2 class="t">Por categoria (em aberto)</h2>${catHtml}` : ''}
    </div>
    <div class="card"><h2>Contas da casa</h2>
      ${totLanc ? `<div class="li"><span>Fatura do cartão (Fatura)<small>Mercado · Variável · 50/50 automático</small></span><b>${R(totLanc)}</b></div>` : ''}
      ${d.map(x => {
        const pg = (x.situacao || 'A pagar') == 'Pago';
        return `<div class="li${pg ? ' pago' : ''}">
          <span><span class="tt">${esc(x.descricao || cn(x.categoria_id))}</span>${pg ? ' <span class="tag">Pago</span>' : ''}<small>${x.data ? x.data.split('-').reverse().slice(0, 2).join('/') + ' · ' : ''}${esc(cn(x.categoria_id))} · ${x.tipo} · minha parte: ${R(mine(x))}</small></span>
          <span><b>${R(x.valor)}</b><br>
            <select data-st="${x.id}" style="width:auto;padding:3px;font-size:.82rem">${['A pagar', 'Pago'].map(s => `<option${s == (x.situacao || 'A pagar') ? ' selected' : ''}>${s}</option>`).join('')}</select>
            <button class="s g" data-del="${x.id}" aria-label="Apagar">×</button>
          </span>
        </div>`;
      }).join('') || (!totLanc ? '<p class="mut">Nenhuma despesa neste mês.</p>' : '')}
    </div>`;

    $('#r').onchange = async e => {
      const id = e.target.dataset.st;
      if (id) {
        const { error } = await sb.from('despesas_casa').update({ situacao: e.target.value }).eq('id', id);
        if (error) toast('Adicione a coluna situacao na tabela despesas_casa no Supabase');
        else load();
      }
    };
    $('#r').onclick = async e => {
      const id = e.target.dataset.del;
      if (id && confirm('Apagar esta despesa?')) {
        await sb.from('despesas_casa').delete().eq('id', id);
        load();
      }
    };
  }
}

async function vPes() {
  S.pm = S.pm || hoje().slice(0, 7);
  const jaq = /jaqueline/i.test(nm(S.user.id) + ' ' + (S.user.email || ''));
  $('#app').innerHTML = `<div class="card"><label>Mês (só você vê esta aba)</label><input id="m" type="month" value="${S.pm}"></div><div id="r"></div>`;
  $('#m').onchange = e => { S.pm = e.target.value; load(); };
  load();

  async function load() {
    const [a, m] = S.pm.split('-').map(Number);
    const [sal, its, dCasa, dLanc] = await Promise.all([
      sb.from('pessoal_salarios').select('*').eq('ano', a).eq('mes', m).maybeSingle(),
      q(sb.from('pessoal_itens').select('*').eq('ano', a).eq('mes', m).order('nome')),
      q(sb.from('despesas_casa').select('*').eq('mes', S.pm + '-01')),
      q(sb.from('lancamentos').select('valor').eq('fatura', S.pm + '-01'))
    ]);
    const mine = x => +x.valor * (x.divisao ? x.divisao[S.user.id] ?? 0 : .5);
    const casaAb = dCasa.filter(x => (x.situacao || 'A pagar') != 'Pago').reduce((z, x) => z + mine(x), 0);
    const fatHalf = dLanc.reduce((z, x) => z + +x.valor, 0) / 2;
    const s = [sal.data?.salario1 || 0, sal.data?.salario2 || 0];
    const c = casaAb + fatHalf;
    const ca = jaq ? [Math.round(c * 100) / 100, 0] : [Math.round(c * 50) / 100, 0];
    if (!jaq) ca[1] = Math.round((c - ca[0]) * 100) / 100;
    let resto = 0;
    const gn = { cartao: 'Cartão', fixo: 'Fixo', outros: 'Outros' };

    const bloco = n => {
      const l = jaq ? its : its.filter(x => x.salario == n);
      const t = l.reduce((z, x) => z + +x.valor, 0) + ca[n - 1];
      const r = s[n - 1] - t;
      resto += r;
      const chart = s[n - 1] > 0 ? barSvg([
        { label: 'Descontos', val: Math.min(t, s[n - 1]), color: '#B57256' },
        { label: 'Livre', val: Math.max(0, r), color: '#7A8B6F' }
      ]) : '';
      return `<div class="card"><h2>${jaq ? 'Salário' : n + 'º salário'}</h2>
        <label>Salário (R$)</label><input id="s${n}" type="number" step="0.01" inputmode="decimal" value="${s[n - 1] || ''}">
        ${chart}
        ${l.map(x => `<div class="li"><span>${esc(x.nome)}<small>${gn[x.grupo] || x.grupo}</small></span><span><b>${R(x.valor)}</b> <button class="s g" data-del="${x.id}" aria-label="Apagar">×</button></span></div>`).join('')}
        <div class="li"><span>Despesa da casa<small>automática (contas a pagar + 50% fatura)</small></span><b>${R(ca[n - 1])}</b></div>
        <div class="li"><span>Total descontado</span><b>${R(t)}</b></div>
        <div class="li"><b>Resto</b><b class="${r < 0 ? 'neg' : ''}">${R(r)}</b></div>
        ${jaq ? '<button id="ss">Salvar salário</button>' : ''}
      </div>`;
    };

    $('#r').innerHTML = (jaq
      ? bloco(1)
      : bloco(1) + bloco(2) + `<div class="card"><div class="mut">Resto total do mês</div><div class="big ${resto < 0 ? 'neg' : ''}">${R(resto)}</div><button id="ss">Salvar salários</button></div>`) +
      `<div class="card"><h2>Novo gasto</h2>
        ${jaq
          ? '<label>Grupo</label><select id="g"><option value="cartao">Cartão</option><option value="fixo">Fixo</option><option value="outros">Outros</option></select>'
          : '<div class="row"><select id="n"><option value="1">1º salário</option><option value="2">2º salário</option></select><select id="g"><option value="cartao">Cartão</option><option value="fixo">Fixo</option><option value="outros">Outros</option></select></div>'}
        <label>Nome</label><input id="nm">
        <label>Valor (R$)</label><input id="v" type="number" step="0.01" inputmode="decimal">
        <button id="add">Adicionar gasto</button>
        <button id="cp" class="g">Copiar gastos do mês anterior</button>
      </div>`;

    $('#ss').onclick = async () => {
      const { error } = await sb.from('pessoal_salarios').upsert({
        user_id: S.user.id,
        ano: a,
        mes: m,
        salario1: +$('#s1').value || 0,
        salario2: jaq ? 0 : (+$('#s2').value || 0)
      }, { onConflict: 'user_id,ano,mes' });
      error ? toast('Erro: ' + error.message) : (toast(jaq ? 'Salário salvo' : 'Salários salvos'), load());
    };
    $('#add').onclick = async () => {
      const v = parseFloat($('#v').value);
      if (!$('#nm').value || isNaN(v)) return toast('Informe nome e valor');
      const { error } = await sb.from('pessoal_itens').insert({
        ano: a,
        mes: m,
        salario: jaq ? 1 : +$('#n').value,
        grupo: $('#g').value,
        nome: $('#nm').value,
        valor: v
      });
      error ? toast('Erro: ' + error.message) : load();
    };
    $('#cp').onclick = async () => {
      if (its.length && !confirm('Este mês já tem gastos. Copiar mesmo assim?')) return;
      const pa = m == 1 ? a - 1 : a, pm = m == 1 ? 12 : m - 1;
      const prev = await q(sb.from('pessoal_itens').select('*').eq('ano', pa).eq('mes', pm));
      if (!prev.length) return toast('O mês anterior não tem gastos');
      await sb.from('pessoal_itens').insert(prev.map(x => ({
        ano: a,
        mes: m,
        salario: jaq ? 1 : x.salario,
        grupo: x.grupo,
        nome: x.nome,
        valor: x.valor
      })));
      load();
    };
    $('#r').onclick = async e => {
      const id = e.target.dataset.del;
      if (id && confirm('Apagar este gasto?')) {
        await sb.from('pessoal_itens').delete().eq('id', id);
        load();
      }
    };
  }
}

sb.auth.getSession().then(({ data: { session } }) => session ? start(session.user) : login());
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
