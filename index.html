<style>

const base=Promise.all(["profiles","cartoes","categorias"].map(n=>q(sb.from(n).select("*").order("id")))).then(r=>{if(r[0].length&&r[2].length){try{localStorage.setItem(k,JSON.stringify(r))}catch(_){}}return r});

function nav(){const h=$("#hdr"),raw=(nm(S.user.id)=="-"?(S.user.email||"").split("@")[0]:nm(S.user.id)).trim(),u=raw?raw[0].toUpperCase()+raw.slice(1):"";h.hidden=false;h.innerHTML=`<div class="hero-usr"><div class="eyebrow">Finanças da Casa</div><div class="usr-title">Olá, ${esc(u)} — vamos ver como estão as finanças?</div></div>`;const n=$("#nav");n.hidden=false;n.innerHTML=Object.entries(TABS).map(([k,[t]])=>`<button data-k="${k}">${ICONS[k]}<span>${t}</span></button>`).join("")+`<button id="out">${ICONS.out}<span>Sair</span></button>`;

function render(){const d=S.fd;const tot=d.reduce((a,x)=>a+ +x.valor,0);const conf=d.filter(x=>x.conferencia=="Conferido").length;const pend=d.filter(x=>!x.conferencia||x.conferencia=="Pendente").length;const divg=d.filter(x=>x.conferencia=="Divergência").length;

`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Compras registradas</h2><span class="badge b-sage">${filtered.length} itens</span></div><div class="pills">${["Todas","Pendente","Conferido","Divergência"].map(st=>`<button class="pill${S.fatFilter===st?" on":""}" data-flt="${st}">${st}</button>`).join("")}</div>${filtered.map(x=>`<div class="li"><span><strong>${esc(x.estabelecimento||x.descricao||"-")}</strong><small>${x.data_compra.split("-").reverse().slice(0,2).join("/")} · ${esc(nm(x.comprador_id))} · ${esc(cn(x.categoria_id))}${cardNm(x.cartao_id)?" · "+esc(cardNm(x.cartao_id)):""}</small>${x.observacao?`<small style="color:var(--pri-dk)">Obs.: ${esc(x.observacao)}</small>`:""}</span><span><b class="num">${R(x.valor)}</b><br><select data-id="${x.id}" style="width:auto;padding:4px 6px;font-size:.78rem;margin-top:4px;border-radius:8px">${["Pendente","Conferido","Divergência"].map(s=>`<option${s==(x.conferencia||"Pendente")?" selected":""}>${s}</option>`).join("")}</select><button class="s g" data-del="${x.id}" aria-label="Apagar" style="margin-left:4px">×</button></span></div>`).join("")||'<p class="mut" style="margin:10px 0 0">Nenhuma compra encontrada neste filtro.</p>'}</div>`;

$("#r").onclick=async e=>{if(e.target.dataset.flt){S.fatFilter=e.target.dataset.flt;render();return}const id=e.target.dataset.del;if(id&&confirm("Apagar esta compra?")){S.fd=S.fd.filter(y=>y.id!=id);render();const{error}=await sb.from("lancamentos").delete().eq("id",id);if(error){toast("Erro: "+error.message);load()}}}}}
async function vCasa(){S.cm=S.cm||hoje().slice(0,7);const outro=S.perf.find(p=>p.id!=S.user.id);
$("#app").innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Nova despesa da casa</h2><span class="badge b-sand">Abate ao pagar</span></div><div class="row"><div><label>Data</label><input id="d" type="date" value="${hoje()}"></div><div><label>Valor (R$)</label><input id="v" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00"></div></div><div class="row"><div><label>Despesa</label><select id="k">${opt(S.cat.filter(x=>x.tipo=="despesa"))}</select></div><div><label>Tipo</label><select id="t"><option>Fixo</option><option>Variável</option></select></div></div><div class="row"><div><label>Situação</label><select id="st"><option value="A pagar">A pagar</option><option value="Pago">Pago</option></select></div><div><label>Minha parte (% — vazio = 50%)</label><input id="p" type="number" min="0" max="100" inputmode="decimal" placeholder="50"></div></div><label>Descrição</label><input id="ds" placeholder="Ex.: Energia, Aluguel, Internet..."><button id="sv">Salvar despesa</button></div><div class="card" style="padding:13px 16px"><label style="margin-top:0">Mês das despesas</label><input id="m" type="month" value="${S.cm}"></div><div id="r"></div>`;
$("#m").onchange=e=>{S.cm=e.target.value;load()};load();
$("#sv").onclick=async()=>{const v=toNum($("#v").value),p=$("#p").value;if(!(v>0))return toast("Valor inválido. Use, por exemplo, 21,99");const divisao=p===""||!outro?null:{[S.user.id]:p/100,[outro.id]:1-p/100};const situacao=$("#st").value||"A pagar";const{error}=await sb.from("despesas_casa").insert({data:$("#d").value,categoria_id:+$("#k").value,tipo:$("#t").value,descricao:$("#ds").value,valor:v,divisao,situacao});error?toast("Erro: "+error.message):(toast("Despesa salva!"),vCasa())};
async function load(){const cm=S.cm,[d,lFat]=await Promise.all([q(sb.from("despesas_casa").select("*").eq("mes",cm+"-01").order("data")),q(sb.from("lancamentos").select("valor").eq("fatura",cm+"-01"))]);if(cm!==S.cm)return;S.cd=d;S.cfat=lFat.reduce((a,x)=>a+ +x.valor,0);render()}
function render(){const d=S.cd,fatTot=S.cfat;const minePct=x=>x.divisao?(x.divisao[S.user.id]??0):0.5;const isPago=x=>x.situacao==="Pago";
const pendentes=d.filter(x=>!isPago(x));const pagos=d.filter(x=>isPago(x));
const totPendenteCasa=pendentes.reduce((a,x)=>a+ +x.valor,0)+fatTot;const totPagoAbatido=pagos.reduce((a,x)=>a+ +x.valor,0);
const minhaParte=pendentes.reduce((a,x)=>a+(+x.valor*minePct(x)),0)+(fatTot*0.5);const outraParte=totPendenteCasa-minhaParte;
const fixosPend=pendentes.filter(x=>x.tipo==="Fixo").reduce((a,x)=>a+ +x.valor,0);const varPend=pendentes.filter(x=>x.tipo!=="Fixo").reduce((a,x)=>a+ +x.valor,0)+fatTot;const fixoPct=totPendenteCasa>0?Math.round((fixosPend/totPendenteCasa)*100):0;
$("#r").innerHTML=`<div class="card card-sage"><div style="display:flex;justify-content:space-between;align-items:center"><div class="eyebrow">Falta Pagar (Total da Casa)</div>${totPagoAbatido>0?`<span class="badge" style="background:rgba(243,239,230,.18);color:#F3EFE6">Abatido pago: ${R(totPagoAbatido)}</span>`:""}</div><div class="big">${R(totPendenteCasa)}</div><div class="mut" style="margin-top:4px">Contas marcadas como "Pago" são abatidas automaticamente aqui e na aba Pessoal.</div><div class="kpis"><div class="kpi"><small>Minha parte (a pagar)</small><b>${R(minhaParte)}</b></div><div class="kpi"><small>Parte ${esc(outro?.nome||"outro")} (a pagar)</small><b>${R(outraParte)}</b></div></div></div>`+
(totPendenteCasa>0?`<div class="card"><h2>Estrutura do que falta pagar</h2><div style="display:flex;justify-content:space-between;font-size:.84rem;margin-bottom:5px"><span><strong style="color:var(--pri-dk)">● Fixos</strong>: <b class="num">${R(fixosPend)}</b> (${fixoPct}%)</span><span><strong style="color:var(--snd-dk)">● Variáveis + Mercado</strong>: <b class="num">${R(varPend)}</b> (${100-fixoPct}%)</span></div><div class="bar-track"><div class="bar-seg-pri" style="width:${fixoPct}%"></div><div class="bar-seg-snd" style="width:${100-fixoPct}%"></div></div></div>`:"")+
`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h2>Contas do mês</h2><span class="badge b-sand">${pendentes.length+(fatTot>0?1:0)} a pagar</span></div>${fatTot>0?`<div class="li" style="background:var(--snd-soft);margin:0 -8px 6px;padding:10px 8px;border-radius:12px;border-top:0"><span><strong>Mercado (Fatura ${S.cm.split("-").reverse().join("/")})</strong><small>Automático da aba Fatura · Variável · 50% / 50%</small></span><span><b class="num">${R(fatTot)}</b><br><span class="badge b-sand" style="margin-top:3px">Automático</span></span></div>`:""}${d.map(x=>{const pago=isPago(x);const pctM=Math.round(minePct(x)*100);return `<div class="li${pago?" is-pago":""}"><span><strong class="item-title">${esc(x.descricao||cn(x.categoria_id))}</strong><small>${esc(cn(x.categoria_id))} · ${x.tipo} · Minha parte: ${pctM}% (${R(x.valor*minePct(x))})</small></span><span><b class="num">${R(x.valor)}</b><br><button class="st-btn ${pago?"pago":"apagar"}" data-toggle="${x.id}" data-st="${pago?"A pagar":"Pago"}">${pago?"✓ Pago":"A pagar"}</button><button class="s g" data-del="${x.id}" aria-label="Apagar" style="margin-left:4px">×</button></span></div>`}).join("")||(!fatTot?'<p class="mut">Nenhuma despesa cadastrada neste mês.</p>':"")}</div>`;
$("#r").onclick=async e=>{const tgl=e.target.closest("[data-toggle]");if(tgl){const nextSt=tgl.dataset.st,id=tgl.dataset.toggle;const x=S.cd.find(y=>y.id==id);if(x)x.situacao=nextSt;render();toast(nextSt==="Pago"?"Marcado como Pago e abatido!":"Reaberto como A pagar");const{error}=await sb.from("despesas_casa").update({situacao:nextSt}).eq("id",id);if(error){toast("Erro: "+error.message);load()}return}const del=e.target.closest("[data-del]");if(del&&confirm("Apagar esta despesa?")){const id=del.dataset.del;S.cd=S.cd.filter(y=>y.id!=id);render();const{error}=await sb.from("despesas_casa").delete().eq("id",id);if(error){toast("Erro: "+error.message);load()}}}}}
async function vPes(){S.pm=S.pm||hoje().slice(0,7);const jaq=/jaqueline/i.test(nm(S.user.id)+(S.user.email||""));
$("#app").innerHTML=`<div class="card" style="padding:13px 16px"><div style="display:flex;justify-content:space-between;align-items:center"><label style="margin:0">Mês pessoal</label><span class="badge b-sage">Privado · só você vê</span></div><input id="m" type="month" value="${S.pm}" style="margin-top:6px"></div><div id="r"></div>`;
$("#m").onchange=e=>{S.pm=e.target.value;load()};load();
async function load(){const[a,m]=S.pm.split("-").map(Number);const[sal,its,dc,lFat]=await Promise.all([sb.from("pessoal_salarios").select("*").eq("ano",a).eq("mes",m).maybeSingle(),q(sb.from("pessoal_itens").select("*").eq("ano",a).eq("mes",m).order("nome")),q(sb.from("despesas_casa").select("*").eq("mes",S.pm+"-01")),q(sb.from("lancamentos").select("valor").eq("fatura",S.pm+"-01"))]);
const fatTot=lFat.reduce((acc,x)=>acc+ +x.valor,0);const minePct=x=>x.divisao?(x.divisao[S.user.id]??0):0.5;const casaPend=dc.filter(x=>x.situacao!=="Pago").reduce((acc,x)=>acc+(+x.valor*minePct(x)),0)+(fatTot*0.5);
const s=[sal.data?.salario1||0,sal.data?.salario2||0];const ca=jaq?[Math.round(casaPend*100)/100,0]:[Math.round(casaPend*50)/100,0];if(!jaq)ca[1]=Math.round((casaPend-ca[0])*100)/100;
let restoTotal=0;const grpLabel=g=>({cartao:"Cartão",fixo:"Fixo",outros:"Outros"}[g]||g);
const bloco=n=>{const l=jaq?its:its.filter(x=>x.salario==n);const gastosPes=l.reduce((z,x)=>z+ +x.valor,0);const totalGastos=gastosPes+ca[n-1];const r=s[n-1]-totalGastos;restoTotal+=r;const salVal=s[n-1];const casaPct=salVal>0?Math.min(100,Math.round((ca[n-1]/salVal)*100)):0;const pesPct=salVal>0?Math.min(100-casaPct,Math.round((gastosPes/salVal)*100)):0;
return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>${jaq?"Meu Salário":n+"º Salário"}</h2><span class="badge ${r<0?"b-apagar":"b-pago"}">${r<0?"No vermelho":"Saldo positivo"}</span></div><label>Valor do salário (R$)</label><input id="s${n}" type="text" inputmode="decimal" autocomplete="off" value="${s[n-1]?String(s[n-1]).replace(".",","):""}" placeholder="0,00">${salVal>0?`<div class="bar-wrap" style="margin-top:12px"><div style="display:flex;justify-content:space-between;font-size:.76rem;color:var(--mut);margin-bottom:4px"><span>● Casa (${casaPct}%)</span><span>● Pessoal (${pesPct}%)</span><span>Livre: ${Math.max(0,100-casaPct-pesPct)}%</span></div><div class="bar-track"><div class="bar-seg-pri" style="width:${casaPct}%"></div><div class="bar-seg-snd" style="width:${pesPct}%"></div></div></div>`:""}<div style="margin-top:10px"><div class="li" style="background:var(--snd-soft);margin:0 -8px 4px;padding:9px 8px;border-radius:10px;border-top:0"><span><strong>Despesa da casa</strong><small>Automática (somente contas A pagar)</small></span><b class="num">${R(ca[n-1])}</b></div>${l.map(x=>{const pago=x.situacao==="Pago";return `<div class="li${pago?" is-pago":""}"><span><span class="item-title">${esc(x.nome)}</span><small>${esc(grpLabel(x.grupo))}</small></span><span><b class="num">${R(x.valor)}</b><br><button class="st-btn ${pago?"pago":"apagar"}" data-toggle="${x.id}" data-st="${pago?"A pagar":"Pago"}">${pago?"✓ Pago":"A pagar"}</button><button class="s g" data-del="${x.id}" aria-label="Apagar" style="margin-left:4px">×</button></span></div>`}).join("")}<div class="li" style="border-top:2px solid var(--bd);margin-top:4px;padding-top:10px"><strong>Resto disponível</strong><b class="num ${r<0?"neg":"ok"}" style="font-size:1.1rem">${R(r)}</b></div></div>${jaq?'<button id="ss">Salvar salário</button>':""}</div>`};
$("#r").innerHTML=(jaq?bloco(1):bloco(1)+bloco(2)+`<div class="card card-sage"><div class="eyebrow">Balanço Consolidado do Mês</div><div class="big">${R(restoTotal)}</div><div class="mut" style="margin-top:3px">Soma do resto do 1º e 2º salário após casa e gastos pessoais.</div><button id="ss" class="snd" style="margin-top:14px">Salvar salários</button></div>`)+`<div class="card"><h2>Adicionar gasto pessoal</h2>${jaq?'<label>Grupo</label><select id="g"><option value="cartao">Cartão</option><option value="fixo">Fixo</option><option value="outros">Outros</option></select>':'<div class="row"><div><label>Salário</label><select id="n"><option value="1">1º salário</option><option value="2">2º salário</option></select></div><div><label>Grupo</label><select id="g"><option value="cartao">Cartão</option><option value="fixo">Fixo</option><option value="outros">Outros</option></select></div></div>'}<label>Nome do gasto</label><input id="nm" placeholder="Ex.: Cartão C6, Curso, Investimento..."><label>Valor (R$)</label><input id="v" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00"><button id="add">Adicionar gasto</button><button id="cp" class="g">Copiar gastos do mês anterior</button></div>`;
$("#ss").onclick=async()=>{const{error}=await sb.from("pessoal_salarios").upsert({user_id:S.user.id,ano:a,mes:m,salario1:toNum($("#s1").value)||0,salario2:jaq?0:(toNum($("#s2").value)||0)},{onConflict:"user_id,ano,mes"});error?toast("Erro: "+error.message):(toast(jaq?"Salário salvo!":"Salários salvos!"),load())};
$("#add").onclick=async()=>{const v=toNum($("#v").value);if(!$("#nm").value.trim()||isNaN(v))return toast("Informe nome e valor");const{error}=await sb.from("pessoal_itens").insert({ano:a,mes:m,salario:jaq?1:+$("#n").value,grupo:$("#g").value,nome:$("#nm").value.trim(),valor:v});error?toast("Erro: "+error.message):(toast("Gasto adicionado"),load())};
$("#cp").onclick=async()=>{if(its.length&&!confirm("Este mês já tem gastos. Copiar mesmo assim?"))return;const pa=m==1?a-1:a,pm=m==1?12:m-1,prev=await q(sb.from("pessoal_itens").select("*").eq("ano",pa).eq("mes",pm));if(!prev.length)return toast("O mês anterior não tem gastos");await sb.from("pessoal_itens").insert(prev.map(x=>({ano:a,mes:m,salario:jaq?1:x.salario,grupo:x.grupo,nome:x.nome,valor:x.valor})));toast("Gastos copiados!");load()};
$("#r").onclick=async e=>{const tgl=e.target.closest("[data-toggle]");if(tgl){const nextSt=tgl.dataset.st;const{error}=await sb.from("pessoal_itens").update({situacao:nextSt}).eq("id",tgl.dataset.toggle);if(error)return toast("Erro: "+error.message);toast(nextSt==="Pago"?"Marcado como Pago!":"Reaberto como A pagar");load();return}const del=e.target.closest("[data-del]");if(del&&confirm("Apagar este gasto?")){await sb.from("pessoal_itens").delete().eq("id",del.dataset.del);load()}}}}
sb.auth.getSession().then(({data:{session}})=>session?start(session.user):login());
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
